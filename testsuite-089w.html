<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 13px/1.5 'Menlo','Consolas',monospace; background:#0d0d0d; color:#ccc; padding:24px; }

<div class="header">

<!-- ── THE ENGINE UNDER TEST ──────────────────────────────────────────────────
     Two builds, one page. ?mode=modular loads the six split files in their
     documented order; anything else loads the monolith. They must produce an
     IDENTICAL board, and eyeballing that in a real browser is the point — jsdom
     is not a browser, and the file:// / no-CORS claim is a browser claim.

     document.write, deliberately. It is the only way to inject CLASSIC scripts
     mid-parse and keep both guarantees the load order depends on: they execute
     in written order, and they execute BEFORE the scripts written below them.
     Appending <script> elements gives neither, and the boot gate is ordering-
     sensitive by construction — core installs the broker, chimera and dsl
     register into it, and the gate fires inline on the last one.

     This list IS the load order. run-suite.js reads it from this page to build
     the monolith, so there is no second copy to drift from it. -->
<script data-runner="skip">
(function () {
  var MODULAR = [
    './modules/i_core-0.89.o.js',
    './modules/i_chimera-18.4.2.js',
    './modules/i_dsl-8.0.0.js',
    './modules/i_superset-10.97.js',
    './modules/i_platform-1.0.js',
    './modules/i_transitions-1.0.js',
    './modules/i_forms-1.0.js'
  ];
  var MONOLITH = ['./Instance-0_89_o.js'];
  /* [0.89.j] MODULES ARE CANONICAL: the split files are the default load, and
     ?mode=monolith opts into the GENERATED bundle (built by run-suite.js).
     ?mode=modular is kept as an accepted no-op for URLs that still carry it. */
  var modular  = !/(?:^|[?&])mode=monolith(?:&|$)/.test(location.search);
  /* ?mode=v9 — kept for URLs that still carry it, but MODULAR now ships v9 by
     default, so the substitution below is a no-op. The note stands because the
     REASON it had to be the modular list has not changed:
     It must be the modular list, and that is not a preference: core destructures
     COMPILER from `build` at module scope, so in the monolith that binding is
     already truthy and Instance.Compiler's getter returns it without ever
     reaching the broker. A late compiler cannot displace one that shipped inside
     the engine. Split out, COMPILER is unbound, the getter falls through to the
     broker, and the v9 IIFE's own provide() is what answers.
     Derived from MODULAR by substitution rather than written out again, so the
     page still holds one list. */
  var usev9    = /(?:^|[?&])mode=v9(?:&|$)/.test(location.search);
  var MODULAR_V9 = MODULAR.map(function (f) {
    return f === '../modules/i_compiler-8.1.0.js' ? '../modules/i_superset-10.97.js' : f;
  });
  var files    = usev9 ? MODULAR_V9 : modular ? MODULAR : MONOLITH;
  window.__ENGINE_MODE  = usev9 ? 'modular+v9' : modular ? 'modular' : 'monolith(generated)';
  window.__ENGINE_FILES = files;
  for (var i = 0; i < files.length; i++)
    /* the suite hosts Instance source as DATA — never let the compiler capture it */
    document.write('<scr' + 'ipt src="' + files[i] + '"' + (/i_superset|Instance-/.test(files[i]) ? ' nocapture' : '') + '><\/scr' + 'ipt>');
})();
</script>

<!-- ═══ THE HARNESS — part of the page: the page IS the suite ═══ -->
<script data-runner="harness">
/**!
 * Instance test harness — globalThis[Symbol.for('TEST_SUITE')]
 * @license FSL-1.1
 *
 * Load the engine, then this harness, then any number of module scripts. As of
 * 0.89.j the MODULES are canonical and the engine loads split by default:
 *
 *     <script src="./modules/i_core-0.89.o.js"><\/script>    …and the rest, in order
 *     <script src="./Instance-0_89_o.js"><\/script>           ?mode=monolith — the
 *                                                              GENERATED bundle
 *
 * This page carries its own cases inline as <script type="text/instance"> blocks,
 * each registering itself and rendering as its own collapsible section; a block
 * that fails to load or parse leaves the others intact.
 *
 * ── module shape ─────────────────────────────────────────────────────────────
 *     (function () {
 *       const T = globalThis[Symbol.for('TEST_SUITE')];
 *       T.module(T.here(), ({ is, js }) => {
 *         is('suite name', 'what it proves', `class K extends Div { … }`);
 *         js('suite name', 'what it proves', `assert(1 === 1, 'maths');`);
 *       });
 *     })();
 *
 *   is()  the source is .is and is compiled through Instance.Compiler first
 *   js()  the source is plain JavaScript and runs as-is
 *
 * Both receive (Instance, Signal, Store, assert, log, play, document) and are
 * wrapped in an async IIFE, so `await` works at the top level of a case.
 *
 * `T.here()` reads data-title and version off the currently-executing script
 * tag, so a module never has to repeat its own name.
 *
 * Runs headless too: with no document, T.run() returns the results and the
 * renderer is skipped. That is what the CI runner uses.
 */
(function (root) {
	'use strict';
	const KEY = Symbol.for('TEST_SUITE');
	if (root[KEY]) return;                       // idempotent: two loads are one harness

	const modules = [];
	/* ═══ INDENTATION, SETTLED ═════════════════════════════════════════════════
	 * Case bodies arrive with MIXED tabs and spaces — authored in editors that
	 * render a tab as 4 columns, displayed in a <pre> that renders it as 8, so
	 * the same bytes produce two different shapes and the panels look ragged.
	 * The cure is not in any one producer (author, converter, compiler emit):
	 * every pane passes through here. LEADING whitespace only — tabs expand at a
	 * 4-column stop, the common indent is removed, trailing space is dropped —
	 * and nothing after a line's first visible character is ever touched, so
	 * string and template CONTENT is never misrepresented. */
	const normalizeIndent = (src) => {
		const lines = String(src).split('\n');
		let min = Infinity;
		const cooked = lines.map(l => {
			let col = 0, i = 0;
			for (; i < l.length; i++) {
				const c = l[i];
				if (c === '\t') col += 4 - (col % 4);
				else if (c === ' ') col += 1;
				else break;
			}
			const body = l.slice(i).replace(/\s+$/, '');
			if (body) min = Math.min(min, col);
			return { col, body };
		});
		if (min === Infinity) min = 0;
		return cooked.map(({ col, body }) => body ? ' '.repeat(col - min) + body : '').join('\n');
	};

	const fnBody = fn => {
		const s = String(fn);
		/* an ARROW: body form (`=> {`) is sliced between its braces; a CONCISE arrow
		 * is pure wrapper around one expression — show the expression, not the
		 * scaffolding. `=> ({…})` is concise too: the next non-space char decides,
		 * so an object literal is not mistaken for a body. */
		const a = s.indexOf('=>');
		if (a >= 0) {
			const rest = s.slice(a + 2);
			const k = rest.search(/\S/);
			if (k < 0) return s;
			if (rest[k] !== '{') return rest.slice(k).replace(/\s+$/, '');
			const open = a + 2 + k;
			return normalizeIndent(s.slice(open + 1, s.lastIndexOf('}')).replace(/^[^\S\n]*\n+/, ''));
		}
		const i = s.indexOf('{');
		return i < 0 ? s : normalizeIndent(s.slice(i + 1, s.lastIndexOf('}')).replace(/^[^\S\n]*\n+/, ''));
	};
	const partySrc = sides =>
		'// native\n' + fnBody(sides.native) + '\n\n// virtual\n' + fnBody(sides.virtual);


	/* ══ FORMAT ══════════════════════════════════════════════════════════════════
	 * Statement-boundary formatter. Case bodies arrive as run-on source because they
	 * were written inline; this puts each statement on its own line at a consistent
	 * indent, so the two panels of a parity case line up and can be read side by
	 * side. Brace- and literal-aware: a `;` inside a string or a template's ${…} is
	 * not a boundary, and a short `{ … }` stays inline rather than exploding into
	 * three lines for one expression.
	 *
	 *     T.format(src)           the same code, on lines
	 *     T.highlight(src, lang)  HTML spans
	 *     T.pretty(src, lang)     both, in that order — what a renderer wants
	 *
	 * LAYOUT IS NOT DECIDED HERE. The harness owns the TEXT; the page owns how it is
	 * arranged. That split is deliberate: a second renderer should not have to fork
	 * the formatter to change a column width.
	 * ═══════════════════════════════════════════════════════════════════════════ */
	function prettySource(src) {
	  /* NORMALIZE FIRST: the statement formatter re-emits BETWEEN statements but
	   * keeps a statement's own internal lines verbatim — which is exactly where
	   * the tab/space mixture lived. Blank-edge lines go; a first line's real
	   * indent survives (trim() would eat it). */
	  src = normalizeIndent(src).replace(/^\n+|\n+$/g, '');
	  if (!src) return '';
	  // 1 — scan once, recording the span of every brace pair and whether each char is code
	  const n = src.length, code = new Uint8Array(n), mate = new Int32Array(n).fill(-1);
	  let str = null, esc = false, tmpl = 0;
	  const stack = [];
	  for (let i = 0; i < n; i++) {
	    const c = src[i];
	    if (str) {
	      code[i] = 0;
	      if (esc) { esc = false; continue; }
	      if (c === '\\') { esc = true; continue; }
	      if (c === str) str = null;
	      continue;
	    }
	    if (c === '"' || c === "'" || c === '`') { str = c; code[i] = 0; continue; }
	    if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') { code[i] = 0; i++; } continue; }
	    if (c === '/' && src[i + 1] === '*') { const e = src.indexOf('*/', i + 2); const stop = e < 0 ? n : e + 2; while (i < stop) { code[i] = 0; i++; } i--; continue; }
	    code[i] = 1;
	    if (c === '{') stack.push(i);
	    else if (c === '}') { const o = stack.pop(); if (o !== undefined) { mate[o] = i; mate[i] = o; } }
	  }
	  // 2 — emit, breaking at statement boundaries
	  const SHORT = 58;                       // brace pairs shorter than this stay inline
	  /* …UNLESS the pair is a STATEMENT LIST. Length alone kept
	   *     class SG1 extends Div { static a = 1; static b = 2; }
	   * on one line — 29 inner chars, well under the threshold — so the .is panel
	   * showed a one-liner beside a fifteen-line compiled panel and the two could not
	   * be read against each other. A top-level `;` inside the pair is the tell: a
	   * class body or a block has them, an object literal `{ a: 1, b: 2 }` and a short
	   * arrow body do not, and those are exactly the pairs worth keeping inline. */
	  const stmts = (open, close) => {
	    let d = 0;
	    for (let k = open + 1; k < close; k++) {
	      if (code[k] !== 1) continue;
	      const ch = src[k];
	      if (ch === '{' || ch === '(' || ch === '[') d++;
	      else if (ch === '}' || ch === ')' || ch === ']') d--;
	      else if (ch === ';' && d === 0) return true;
	    }
	    return false;
	  };
	  let out = '', depth = 0, paren = 0, line = '', inline = 0;
	  const flush = () => { if (line.trim()) out += '  '.repeat(Math.max(0, depth)) + line.trim() + '\n'; line = ''; };
	  for (let i = 0; i < n; i++) {
	    const c = src[i], isCode = code[i] === 1;
	    if (isCode && (c === '(' || c === '[')) paren++;
	    if (isCode && (c === ')' || c === ']')) paren--;
	    if (isCode && c === '{') {
	      const long = mate[i] > 0 && (mate[i] - i > SHORT || stmts(i, mate[i]));
	      if (long && paren === 0 && inline === 0) { line += c; flush(); depth++; continue; }
	      inline++;                                  // kept inline — its innards must not break
	    }
	    if (isCode && c === '}') {
	      if (inline > 0) {
	        inline--;
	        /* An inline `{ … }` ends a statement just as a `;` does. Without this the
	         * code AFTER it ran on: `if (x) { a; b; } return c;` stayed one line, and
	         * two panels of a parity case would not line up. */
	        if (inline === 0 && paren === 0) {
	          line += c;
	          /* absorb a trailing `;` so it does not orphan onto its own line */
	          if (src[i + 1] === ';') { line += ';'; i++; }
	          flush();
	          continue;
	        }
	      }
	      else if (paren === 0 && mate[i] >= 0) {
	        flush(); depth--; line = c;
	        if (src[i + 1] === ';') { line += ';'; i++; }
	        flush(); continue;
	      }
	    }
	    line += c;
	    if (isCode && c === ';' && paren === 0 && inline === 0) flush();
	  }
	  flush();
	  return out.replace(/\n{3,}/g, '\n\n').trimEnd();
	}

	/* ══ HIGHLIGHT ═══════════════════════════════════════════════════════════════
	 * Syntax highlighting for the source panels, for BOTH languages. Exposed on the
	 * harness so the page's renderer does not have to carry its own copy — and so a
	 * module can call it too.
	 *
	 *     T.highlight(src, 'js' | 'is')  →  HTML with <span class="…"> runs
	 *
	 * Span classes: sk keyword · sg .is grain marker · ss string/template/regex ·
	 * sn number · sc comment · si sigiled name · scl ClassName · sf call() ·
	 * sp punctuation.
	 *
	 * It is a SCANNER, not a parser: literals first (so a brace inside a string is
	 * never mistaken for code), then words, then punctuation. Regex-vs-division uses
	 * the previous significant token, the same rule the compiler's scanner uses —
	 * `a / b` is division, `a = /re/g` is a regex.
	 * ═══════════════════════════════════════════════════════════════════════════ */
	const KEYWORDS = new Set(('class extends const let var function return new delete typeof instanceof ' +
		'if else for in of while do switch case break continue default try catch finally throw ' +
		'await async import export this super yield void get set null true false undefined').split(' '));
	/* STORAGE MODIFIERS, split out of the control keywords the way VSCode splits them:
	 * `class`/`extends`/`await` are control-purple, `static` is modifier-blue. The .is
	 * grains join whichever set their POSITION puts them in — see below. */
	const MODIFIERS = new Set(['static']);
	/* the .is superset — highlighted distinctly, because they are the whole point */
	const GRAINS = new Set(['mixed', 'iterable', 'sync', 'defer', 'using', 'async']);
	const RE_OK = new Set(['=', '(', ',', '[', '{', ':', ';', '!', '&', '|', '?', '+', '-', '*', '%', '<', '>', '~',
		'return', 'typeof', 'case', 'in', 'of', 'instanceof', 'new', 'yield', 'await', 'throw', 'do', 'else', 'default', 'for']);
	const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	const wrap = (cls, txt) => '<span class="' + cls + '">' + esc(txt) + '</span>';

	function highlight(src, lang) {
		src = String(src == null ? '' : src);
		const n = src.length;
		let out = '', i = 0, prev = null;
		const isId = c => c !== undefined && /[\p{ID_Continue}Δ_#@]/u.test(c);
		while (i < n) {
			const c = src[i], s0 = i;
			/* comments */
			if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; out += wrap('sc', src.slice(s0, i)); continue; }
			if (c === '/' && src[i + 1] === '*') { const e = src.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; out += wrap('sc', src.slice(s0, i)); continue; }
			/* strings and templates */
			if (c === '"' || c === "'" || c === '`') {
				const q = c; i++;
				let depth = 0;
				while (i < n) {
					const d = src[i];
					if (d === '\\') { i += 2; continue; }
					if (q === '`' && d === '$' && src[i + 1] === '{') { depth++; i += 2; continue; }
					if (q === '`' && d === '}' && depth > 0) { depth--; i++; continue; }
					i++;
					if (d === q && depth === 0) break;
				}
				out += wrap('ss', src.slice(s0, i)); prev = 'str'; continue;
			}
			/* a regex literal, only where one may legally begin */
			if (c === '/' && (prev === null || RE_OK.has(prev))) {
				let j = i + 1, cls = false, ok = false;
				while (j < n) {
					const d = src[j];
					if (d === '\\') { j += 2; continue; }
					if (d === '\n') break;
					if (d === '[') cls = true;
					else if (d === ']') cls = false;
					else if (d === '/' && !cls) { j++; while (j < n && /[a-z]/i.test(src[j])) j++; ok = true; break; }

 * Object.keys and JSON, and so does this. Internal state says so with a
 * descriptor keyword, a sigil or a #private. (Until 0.89.o elements hid bare
 * fields: hiding was otherwise inexpressible, and the keywords made it unnecessary.) */

class CS extends Div { static a = 1; }

assert(JSON.stringify(en) === '{"a":1}', '\u2026JSON carries it: ' + JSON.stringify(en));
assert(JSON.stringify({ ...en }) === '{"a":1}', '\u2026and spread copies it');
assert(Object.getOwnPropertyDescriptor(CS, 'a').enumerable === true, 'a class static is enumerable too');
assert(JSON.stringify(Object.keys(CS)) === '["a"]', '\u2026so Object.keys(K) sees it: ' + JSON.stringify(Object.keys(CS)));
assert(JSON.stringify({ ...CS }) === '{"a":1}', '\u2026and spread works');
class INT extends Div { ply p = 1; let l = 1; const c = 1; get g = 1; }

<script type="text/instance" module="CORE" version="94" section="Frozen / Sealed prototypes" name="freeze refuses a settled-field write; seal does not">
/* A DECLARED FIELD IS THE ANALOGUE OF AN OWN DATA PROPERTY, so freeze must refuse
 * it. It is an accessor underneath, and an accessor's setter runs even on a frozen
 * object — `writable` has no meaning for one — so the refusal is explicit in the
 * setter rather than free. SEAL stays writable, matching the platform, and telling
 * the two apart needs a probe: `Object.isFrozen` reports TRUE for a merely SEALED
 * object whose own properties are all accessors, because an accessor has no
 * writability for it to inspect. */
class FZ extends Div { a = 1; }

const plain = new FZ(); plain.a = 5;
assert(plain.a === 5, 'an ordinary write is unaffected');

const sealed = new FZ(); Object.seal(sealed); sealed.a = 6;
assert(sealed.a === 6, 'a sealed object still accepts writes, as the platform does');

const frozen = new FZ(); Object.freeze(frozen);
let refused = null;
try { frozen.a = 99; } catch (e) { refused = e; }
assert(refused instanceof TypeError, 'a frozen object refuses: ' + refused);
assert(frozen.a === 1, '…and the value is unchanged');
</script>

assert(d.title === 't', 'native: a frozen element still accepts an intrinsic write');

const g = new IN(); Object.freeze(g);

<script type="text/instance" module="COMPILER" version="41" sandbox section="structural" name="structured goto: the action x target grid, flat and nested">
const trace = [];
class GT extends Div {
    run(events) {
        let i = 0, retries = 0;
        start: {
            if (i >= events.length) goto done;
            const e = events[i];
            if (e.type === 'retry') goto retry;
            trace.push(e.type);
            goto next;
        }
        retry: {
            const e = events[i];
            if (retries < 3) { retries++; trace.push(e.type); goto continue; }
            trace.push('gaveup');
            goto continue;
        }
        next: { i++; goto start; }
        done: { goto return; }
        trace.push('after');
        return retries;
    }
    nested() {
        let hops = 0;
        outer: {
            inner: {
                hops++;
                if (hops < 2) goto super;          // restart the PARENT
                goto break super;                  // leave the parent entirely
            }
            trace.push('unreachable');
            goto return;
        }
        return hops;
    }
}
const g = new GT();
assert(g.run([{type:'a'},{type:'retry'},{type:'b'}]) === 1, 'the machine ran: ' + trace.join(','));
assert(trace.join(',') === 'a,retry,b,after', 'edges in order, goto return resumed the function: ' + trace.join(','));
trace.length = 0;
assert(g.nested() === 2, 'goto super restarted the parent, goto break super left it: ' + g.nested());
assert(trace.length === 0, 'and the parent postamble was skipped by break super');
const em = (src) => Instance.Superset.compile('class GQ extends Div { m() { ' + src + ' } }').code;
assert(/ølabel\d+ = "b"; continue ølabel\d+/.test(em('a: { goto continue; }\nb: { goto return; }')), 'goto continue targets the next sibling BY NAME');
assert(/break ølabel\d+/.test(em('a: { goto break; }')), 'goto break leaves the level');
assert(/break ølabel\d+/.test(em('a: { goto void; }')), 'goto void is an alias of goto return');
assert(/ølabel\d+ = "a"; continue ølabel\d+/.test(em('a: { if (q) goto break; goto this; }')), 'goto this restarts, and bare goto is its alias');
</script>

<script type="text/instance" module="COMPILER" version="41" sandbox section="structural" name="goto yield suspends the machine: state is set BEFORE the suspension, so a resume lands where you said">
class GY extends Div {
    *drive() {
        let n = 0;
        wait: {
            n++;
            const e = yield n;
            if (e === 'stop') goto break;
            goto;
        }
        return n;
    }
}

const em2 = Instance.Superset.compile('class GZ extends Div { *m() { a: { if (q) goto break; goto yield; } } }').code;

h.return('abandoned');

</script>

<script type="text/instance" module="DSL" version="11" sandbox section="settlement · control" name="siblings of one class have independent fates">
mixed class* H extends Div { sync Δv = await new Promise(r => setTimeout(() => r('landed'), 10)); }

await new Promise(r => setTimeout(r, 40));

assert(held.Δv === undefined && held.Δ.v.peek() === Symbol.for('??'), 'the held one did not (value undefined, cell ??)');
await held.resume();
assert(held.Δv === 'landed', 'released');
</script>

<script type="text/instance" module="DSL" version="11" sandbox section="stepping" name="the chain is claimed base→leaf and steps to completion" kind="intended" why="v8 yielded a breakpoint per FIELD; those name-yields sat in the synchronous prefix and are retired. The driver now holds at the PARTITION, so a per-field trace has nothing to report. What the case still pins is the part that did not change: levels are claimed base&#8594;leaf and construction completes.">
class SA extends Div { a = 1; }
class SB extends SA  { b = 2; }
class SC extends SB  { c = 3; }
const dbg = Instance.debugConstruct(() => new SC());
assert(dbg.levels.join(',') === 'SA,SB,SC', 'levels claimed base→leaf: ' + dbg.levels.join(','));
let r, steps = 0;
while (!(r = dbg.step()).done) steps++;
assert(steps >= 0 && r.done, 'stepping terminates');
assert(dbg.element.a === 1 && dbg.element.c === 3, 'every level still settled: construction completed');
</script>

<script type="text/instance" module="DSL" version="11" sandbox section="stepping" name="redeclaration: the child clobbers the parent" kind="intended" why="v8 yielded a breakpoint per FIELD; those name-yields sat in the synchronous prefix and are retired. The driver now holds at the PARTITION, so a per-field trace has nothing to report. What the case still pins is the part that did not change: levels are claimed base&#8594;leaf and construction completes.">

<script type="text/instance" module="EVENTS" version="3" sandbox section="pulse · mint" name="new fires (outcome readable) · bare mints inert · no replay · atomic re-entry · collision naming">
const btn = new Div().appendTo(play);
assert(typeof MouseDown === 'function' && typeof KeyUp === 'function' && typeof FocusIn === 'function', 'the vocabulary minted (MouseDown, KeyUp, FocusIn)');
assert(typeof globalThis.Key === 'undefined' && typeof DblClick === 'function' && typeof PopState === 'function', 'grammar honored: no bare Key; compounds resolved (DblClick, PopState)');
assert(Instance.Events.SelectEvent && Instance.Events.ResetEvent && Instance.Events.StorageEvent, 'collisions postfixed: select/reset/storage → …Event (element + native-global rules)');
new MouseDown({ target: btn });                       // fire BEFORE subscribing — must not replay
let heard = 0, seen = null;
const off = btn.on(MouseDown, (ev, el) => { heard++; seen = ev; });
assert(heard === 0, 'no replay: the pre-subscription mousedown was not delivered');
const ev = new MouseDown({ target: btn, clientX: 7 });
assert(heard === 1 && seen === ev && ev instanceof MouseEvent && ev.clientX === 7, 'new fires: a REAL MouseEvent, delivered to the subscriber, the very object returned');
assert(ev instanceof MouseDown && !(ev instanceof KeyUp), 'type-branded instanceof');
const off2 = btn.on(MouseDown, e => e.preventDefault());
const ev2 = new MouseDown({ target: btn });
assert(ev2.defaultPrevented === true, 'dispatch is synchronous ⇒ the constructor returns the SPENT event: the outcome is readable');
const inert = MouseDown({ clientX: 3 });
const h0 = heard;
assert(heard === h0 && inert instanceof MouseEvent, 'bare call mints INERT');
btn.dispatchEvent(inert);
assert(heard === h0 + 1, '…and a later native dispatch converges through the same pump');
const order = []; let depth = 0;
const off3 = btn.on(Wheel, () => { order.push('h' + depth); if (depth++ < 2) new Wheel({ target: btn }); });
new Wheel({ target: btn });
assert(order.join(',') === 'h0,h1,h2', 'self re-entrant fires deliver IN ORDER — handlers are atomic (got ' + order.join(',') + ')');
off(); off2(); off3();
</script>

<script type="text/instance" module="EVENTS" version="3" sandbox section="pulse · lifecycle" name="dispose drains subscriptions; pulses compose into the signal graph">
const c = new Div().appendTo(play);
c.Δcount = 0;                                          // runtime reactive field — the trap routes it to the element store
let armed = false;
new Signal.Effect(() => { const n = c.Δcount; if (!armed) { armed = true; c.textContent = 'n=' + n; return; } c.textContent = 'n=' + n; });
assert(c.textContent === 'n=0', 'behavior face armed');
c.on(Click, () => { c.Δcount = c.Δcount + 1 });        // the PULSE feeds the BEHAVIOR — the practical combinator
new Click({ target: c }); new Click({ target: c });
assert(c.Δcount === 2 && c.textContent === 'n=2', 'event → Δstate → effect: the pulse composes into the signal graph, every occurrence counted');
const spy = new Div().appendTo(play);
let alive = 0;
spy.on(KeyDown, () => alive++);
new KeyDown({ target: spy });
assert(alive === 1, 'subscribed and hearing');
spy.remove(true);                                      // dispose — the teardown spine must drain the event subscription
await new Promise(r => setTimeout(r, 15));
let threw = false;
try { spy.dispatchEvent(new KeyboardEvent('keydown')) } catch (e) { threw = true }
assert(!threw && alive === 1, 'disposed: the drained subscription never fires again, and dispatch on the corpse is harmless');
assert(typeof MouseDown.on === 'function', 'class-face sugar exists: MouseDown.on(target, fn)');
let viaSugar = 0;
const offS = MouseDown.on(play, () => viaSugar++);
new MouseDown({ target: play });
assert(viaSugar === 1, '…and works');
offS();
const native = new Instance.Events.InputEvent('input', { data: 'x' });
assert(native instanceof InputEvent && native.data === 'x', 'string-first-arg is the NATIVE signature: passthrough (foreign-code compat), built over the real InputEvent interface');
</script>

<script type="text/instance" module="EVENTS" version="3" sandbox section="pulse · combinators" name="events are Signals — config filter · map · combine · sleep · chain; subscribe(Class,…); DSL+text">
const el = new Div().appendTo(play);
const click = MouseDown();
let plain = 0;
el.on(click, () => plain++);
new MouseDown({ target: el });
assert(plain === 1 && click instanceof MouseEvent, 'a bare-call handle reads like a signal — and is still a real (inert) MouseEvent');
const counts = [];
el.on(click.map((e, i) => i + 1), n => counts.push(n));
new MouseDown({ target: el }); new MouseDown({ target: el });
assert(counts.join(',') === '1,2', 'map derives — transform + occurrence index');
const dbl = [];
el.on(click.combine(DblClick, (c, d) => !!(c && d)), v => dbl.push(v));
new MouseDown({ target: el });
assert(dbl[dbl.length - 1] === false, 'combine fires on either — falsy until both sides seen');
new DblClick({ target: el });
assert(dbl[dbl.length - 1] === true, '…truthy once the latest pair is complete');
let gest = 0;
el.on(click.chain(click.sleep(40), (c, h) => !!(c && h)), v => { if (v === true) gest++; });
new MouseDown({ target: el });
await new Promise(r => setTimeout(r, 90));
assert(gest >= 1, 'sleep delays per occurrence; chain detects the sequence — a hold gesture');
let rights = 0;
el.on(MouseDown({ button: 2 }), () => rights++);
new MouseDown({ target: el, button: 0 }); new MouseDown({ target: el, button: 2 });
assert(rights === 1, 'the bare-call init doubles as a subscription CONFIG — an own-key equality filter');
class Feed extends Div { static Δtick = 0; }
const f = new Feed().appendTo(play);
let got = null;
f.subscribe(Feed, 'Δtick', v => got = v);
Feed.Δtick = 9;
assert(got === 9, "subscribe(ParentClass, 'Δfield', cb) — '@change' semantics, class explicit");
let one = 0; f.subscribe(() => one++); f.notify();
assert(one === 1, 'the 1-arg subscribe/notify pair is untouched');
play.className = 'q8bplay';
const t = new Div('@append .q8bplay', 'hello world');
assert(t.textContent === 'hello world' && t.parentElement === play, 'a plain string beside a DSL route is CONTENT');
const named = new Div('just-a-name');
t.remove(true); named.remove(true);
</script>

<script type="text/instance" module="EVENTS" version="3" sandbox section="pulse · string protocol" name="five regex symbols, Instance-semantic (intentional divergence)">
class Doc extends Div {}
const a = new Doc().appendTo(play); a.textContent = 'apple pie';
const b = new Doc().appendTo(play); b.textContent = 'banana bread';
const c = new Doc().appendTo(play); c.textContent = 'apple cider';
// search = PREDICATE (Number). CLASS → registry index; round-trips through Class[n].
assert('apple'.search(Doc) === 0, 'search(Class) → registry index of first match');
assert(Doc['apple'.search(Doc)] === a, 'the index round-trips: q.search(Class) → n → Class[n]');
assert('pie'.search(a) === 6, 'search(element) → char offset in its text');
assert('zzz'.search(Doc) === -1 && 'zzz'.search(a) === -1, 'no match → -1');
// match = FILTER → a real Collection of matching elements.
const m = 'apple'.match(Doc);
assert(m instanceof Instance.Collection, 'match(Class) → a real Collection');
assert(m.length === 2 && m[0] === a && m[1] === c, 'Collection is indexable with the matches');
assert(typeof m.where === 'function', 'the Collection is .where-able (the real type, live)');
assert('apple'.match(a) === a && 'xyz'.match(a) === null, 'match(element) → self-test: the element or null');
// matchAll = WALKER (lazy). CLASS → {element,index}; ELEMENT → {text,index}.
const all = [...'apple'.matchAll(Doc)];
assert(all.length === 2 && all[0].element === a && all[0].index === 0 && all[1].element === c && all[1].index === 2, 'matchAll(Class) → each matching {element, index}');
const occ = [...'p'.matchAll(a)];
assert(occ.length === 3 && occ.every(x => 'text' in x && 'index' in x), 'matchAll(element) → each {text, index} occurrence');
// replace = MUTATOR — the one verb that writes: swaps matched text in the live DOM.
'apple'.replace(a, 'APPLE');
assert(a.textContent === 'APPLE pie', 'replace(element) swaps matched text IN the DOM');
a.textContent = 'apple pie';
const coll = 'apple'.replace(Doc, (seg, el) => '[' + el.tagName + ']');
assert(coll instanceof Instance.Collection && coll.length === 2, 'replace(Class) → the matching Collection (chainable)');
assert(a.textContent.indexOf('[DIV]') !== -1 && c.textContent.indexOf('[DIV]') !== -1, 'function replacer runs on every matching element, receiving (seg, element)');
assert(b.textContent === 'banana bread', 'non-matching elements are untouched (pure where it does not match)');
a.textContent = 'apple pie'; c.textContent = 'apple cider';
// split = PARTITIONER. CLASS → [matching, nonmatching]; ELEMENT → [before, after].
const [hits, misses] = 'apple'.split(Doc);
assert(hits instanceof Instance.Collection && misses instanceof Instance.Collection, 'split(Class) → two Collections');
assert(hits.length === 2 && misses.length === 1 && misses[0] === b, 'split(Class) partitions [matching, nonmatching]');
assert(JSON.stringify('pie'.split(a)) === '["apple ",""]', 'split(element) → [before, after] around the first match');
// PURITY: only replace writes. search/match/matchAll/split leave the DOM alone.
const snap = a.textContent;
'apple'.search(Doc); 'apple'.match(Doc); [...'apple'.matchAll(Doc)]; 'apple'.split(Doc);
assert(a.textContent === snap, 'the four read verbs are pure — no hidden mutation');
a.remove(true); b.remove(true); c.remove(true);
</script>

<script type="text/instance" module="EVENTS" version="3" sandbox section="pulse · teardown protocol" name="element face, async twin, using-alias, class self-destruct">
class E extends Div {}
const e1 = new E().appendTo(play);
e1[Instance.DISPOSE]();
await new Promise(r => setTimeout(r, 15));
assert(!e1.isConnected && E.all().length === 0, 'el[DISPOSE]() disposes: detached, unregistered');
const e2 = new E().appendTo(play);
const usingKey = typeof Symbol.dispose === 'symbol' ? Symbol.dispose : Symbol.for('Instance.dispose.shim');
e2[usingKey]();
await new Promise(r => setTimeout(r, 15));
assert(!e2.isConnected, 'the well-known alias routes to the protocol (Symbol.dispose where the realm has it, the shim key where it does not)');
const e3 = new E().appendTo(play);
await e3[Instance.ASYNC_DISPOSE]();
assert(!e3.isConnected && E.all().length === 0, 'the async twin awaits @removal/@unmount, then reclaims');
class A2 extends Div {} class B2 extends A2 {}
new A2().appendTo(play); new B2().appendTo(play);
B2[Instance.DISPOSE]();
await new Promise(r => setTimeout(r, 15));
assert(B2.all().length === 0 && A2.all().length === 1, 'subclass self-destruct via the inherited symbol static — siblings untouched');
await A2.teardownAsync();
assert(A2.all().length === 0, 'named async orchestrator on a subclass');
</script>

<!-- a PAGE instance script — no module attribute, so the ENGINE (not the harness)
     compiles and runs it at DOMContentLoaded. `sandbox` = run()'s async-IIFE lane:
     top-level await works and declarations stay inside. The EVENTS case below
     asserts both halves. -->
<script type="text/instance" sandbox>
const local = 'sandboxed';
window.__PAGE_BLOCK = { ran: true, leaked: typeof globalThis.local !== 'undefined' };
</script>

<!-- the renderer -->
<script data-runner="skip">
(function () {
'use strict';
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* [0.89.j] THE BROKER IS THE ENTRY POINT, and the only one this page uses:
   `globalThis[Symbol.for('Instance')]()` resolves the latest registered build.
   The old `new window.Instance(globalThis)` spelling leaned on core minting a
   GLOBAL BINDING — a convenience, not the protocol — and when the engine is
   absent it fails as "window.Instance is not a constructor", which names the
   binding instead of the problem. Calling the broker says the true thing: no
   broker on the page means no engine on the page. The call form is synchronous
   (a build registers as its script finishes); ready() covers a build that
   registers later. */
(async () => {
  const IVC = globalThis[Symbol.for('Instance')];
  if (typeof IVC !== 'function')
    throw new Error('no Instance broker at Symbol.for("Instance") — the engine did not load');
  return IVC() || await IVC.ready();
})().then(async (Instance) => {
  const T = globalThis[Symbol.for('TEST_SUITE')];
  /* COLLECT FIRST, then check: every case is a block in this page, so there are
     no modules at all until T.page() has walked the DOM. */
  if (T) T.page(document);
  if (!T || !T.modules.length) {
    document.getElementById('summary').innerHTML = '<span class="bad">no test modules loaded</span>';
    return;
  }
  const out = document.getElementById('out');
  const report = await T.run(Instance);
  window.__REPORT = report;
  let PASS = 0, FAIL = 0, DIV = 0, DIFFC = 0, WARNC = 0;

  for (const mod of report) {
    const d = mod.results.filter(r => r.diverged).length;
    const p = mod.results.filter(r => r.pass && !r.diverged).length;
    const f = mod.results.length - p - d;
    PASS += p; FAIL += f; DIV += d;
    DIFFC += mod.results.filter(r => r.diverged && r.severity !== 'warn').length;
    WARNC += mod.results.filter(r => r.diverged && r.severity === 'warn').length;

    const box = $('details', 'mod'); box.open = f > 0 || report.length <= 4;
    const sum = $('summary');
    sum.append($('span', 'mod-name', mod.title));
    if (mod.version) sum.append($('span', 'mod-ver', 'v' + mod.version));
    if (mod.src) sum.append($('span', 'mod-src', mod.src));
    const count = $('span', 'mod-count');
    count.innerHTML = (f ? '<b class="bad">' + f + ' fail</b> &middot; ' : '') + p + ' pass' +
                      (d ? ' &middot; <b class="div">' + d + ' by design</b>' : '');
    sum.append(count);
    box.append(sum);

    let lastSuite = null;
    for (const r of mod.results) {
      if (r.suite !== lastSuite) { box.append($('div', 'suite-head', '\u2500\u2500 ' + r.suite)); lastSuite = r.suite; }
      const sev = r.diverged ? (r.severity === 'warn' ? 'warn' : 'diff') : (r.pass ? 'pass' : 'fail');
      const row = $('div', 'test ' + sev);
      row.append($('span', 'badge', sev === 'diff' ? 'DIFF' : sev === 'warn' ? 'WARN' : sev.toUpperCase()));
      row.append($('span', 'lang', r.lang));
      row.append($('span', 'label', r.name));

      /* PANELS — two columns down the middle, two rows. The harness supplies the
       * text (formatted and highlighted); this page decides the arrangement. */
      const panels = $('div', 'panels closed');
      const panel = (cls, head, html) => {
        const p = $('div', 'panel');
        p.append($('div', 'panel-h' + (cls ? ' ' + cls : ''), head));
        const pre = $('pre'); pre.innerHTML = html; p.append(pre);
        return p;
      };
      if (r.panes) {
        panels.append(panel('', 'vanilla js (native engine)', T.pretty(r.panes.native, 'js')));
        panels.append(panel('v', 'hybridized virtual class inheritance [instance.js]', T.pretty(r.panes.virtual, 'js')));
      } else if (r.lang === 'is') {
        /* SOURCE LEFT, COMPILED RIGHT — side by side, because that is the comparison
           the panel exists to make. They used to sit in the same column, one above the
           other, so reading a field against its emit meant scrolling past fifteen lines
           of generator to find the line it came from. */
        /* a source MEANT to be refused wears russet, not gold — the panel says at a
           glance that failing is the point, and the compiled column carries the
           `/* SyntaxError @line N *​/` the compiler emitted in its place. */
        panels.append(panel(r.expect ? 'x' : 's',
          r.expect ? 'instance source [.is] \u2014 refused by design' : 'instance source [.is]',
          T.pretty(r.src, 'is')));
        panels.append(panel('', 'compiled output [.js]',
          (function () { try { return T.highlight(T.normalize(Instance.Compiler.compile(r.src,
                           r.expect ? { recover: true } : { step: false }).code), 'js'); }
                         catch (e) { return ''; } })()));
      } else {
        /* A js case is INSTANCE code, not native code — it belongs in the right-hand
           column, under 'hybridized virtual class inheritance', with the native column left empty.
           It used to sit on the left labelled 'source', which read as the vanilla side
           and put Instance code in the column reserved for the engine's own. */
        panels.append(panel('', '\u00a0', ''));
        panels.append(panel('v', 'hybridized virtual class inheritance [instance.js]', T.pretty(r.src, 'js')));
      }
      const outP = $('div', 'panel');
      outP.append($('div', 'panel-h o', 'output'));
      if (r.outcome) {
        for (const side of ['native', 'virtual']) {
          const v = r.outcome[side];
          const line = $('div', 'out-line');
          line.innerHTML = side + ' \u2192 <b class="' + (v === true ? '' : 'no') + '">' + String(v) + '</b>';
          outP.append(line);
        }
      }
      for (const l of (r.logs || [])) outP.append($('div', 'out-line', l));
      if (r.stage) { const st = $('div', 'stage'); st.innerHTML = '<b>element</b> ' + r.stage; outP.append(st); }
      if (!r.outcome && !(r.logs || []).length && !r.stage)
        outP.append($('div', 'out-line', r.pass ? String(r.count) + ' assertion' + (r.count === 1 ? '' : 's') + ' passed' : ''));
      panels.append(outP);

      const btn = $('button', 'src-btn', 'run');
      btn.onclick = () => {
        panels.classList.toggle('closed');
        btn.textContent = panels.classList.contains('closed') ? 'run' : 'close';
      };
      row.append(btn);
      box.append(row);
      box.append(panels);
      if (r.diverged && r.why) box.append($('div', 'why ' + sev, r.why));
      if (!r.pass && !r.diverged) {
        if (r.error) box.append($('div', 'detail', '! ' + String(r.error.message).split('\n')[0]));
        for (const b of r.failed) box.append($('div', 'detail', '\u00b7 ' + b.msg));
        if (!r.error && !r.failed.length && !r.count) box.append($('div', 'detail', '\u00b7 no assertions ran'));
      }
    }
    out.append(box);
  }

  document.getElementById('summary').innerHTML =
    '<span class="ok">pass ' + PASS + '</span> &nbsp; <span class="bad">fail ' + FAIL + '</span>' +
    ' &nbsp; <span class="divc">by design ' + DIFFC + '</span>' +
    ' &nbsp; <span class="warnc">warn ' + WARNC + '</span>' +
    ' &nbsp; <span class="dim">of ' + (PASS + FAIL + DIV) + ' across ' + report.length + ' module' +
    (report.length === 1 ? '' : 's') + ' &mdash; Instance ' + (Instance.version || '0.89.d') + ' &middot; ' + (window.__ENGINE_MODE || '?') + '</span>';
}).catch(function (e) {
  document.getElementById('summary').innerHTML = '<span class="bad">BOOT FAILED: ' + e.message + '</span>';
});
})();
</script>
